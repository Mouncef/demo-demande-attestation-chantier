# Cloisonnement réseau : le backend n'accepte que le frontend, PostgreSQL et le SMTP de Mailpit n'acceptent
# que le backend. Le frontend et l'interface Mailpit restent joignables par Traefik (réseau hôte du nœud).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-ingress
spec:
  podSelector:
    matchLabels:
      app: mailpit
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 1025
    # Interface web : joignable par Traefik (hostNetwork), protégée par authentification basique.
    - ports:
        - port: 8025
