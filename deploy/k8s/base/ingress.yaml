# Exposition via Traefik (CRD) et certificat Let's Encrypt (cert-manager, ClusterIssuer letsencrypt-prod).
# Traefik redirige déjà tout le trafic HTTP vers HTTPS au niveau de l'entrypoint `web`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-axa-tls
spec:
  secretName: demo-axa-tls
  dnsNames:
    - demo.zaghratmouncef.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=()
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
---
# Authentification basique devant l'interface Mailpit (secret `mailpit-auth`, clé `users` au format htpasswd).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mailpit-auth
spec:
  basicAuth:
    secret: mailpit-auth
    realm: Mailpit demo-axa
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo-axa
  annotations:
    # Le provider CRD de Traefik est restreint à cette classe (--providers.kubernetescrd.ingressClass=traefik).
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`demo.zaghratmouncef.com`) && PathPrefix(`/mailpit`)
      middlewares:
        - name: secure-headers
        - name: mailpit-auth
      services:
        - name: mailpit
          port: 8025
    - kind: Rule
      match: Host(`demo.zaghratmouncef.com`)
      middlewares:
        - name: secure-headers
      services:
        - name: frontend
          port: 80
  tls:
    secretName: demo-axa-tls
