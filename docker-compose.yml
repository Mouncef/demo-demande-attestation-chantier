# =============================================================================
# Plateforme de gestion des demandes d'attestation de chantier – démarrage :
#     cp .env.example .env   (facultatif : valeurs par défaut de développement intégrées)
#     docker compose up --build
# Services :
#   db        PostgreSQL 16
#   backend   API Django (migrations automatiques)   http://localhost:8000/api/docs/
# =============================================================================
name: attestations-chantier

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attestations}
      POSTGRES_USER: ${POSTGRES_USER:-attestations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestations-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attestations} -d ${POSTGRES_DB:-attestations}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-9f2c1b7e4a6d8e0f1c3b5a7d9e2f4c6b8a0d1e3f5c7b9a2d4}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      POSTGRES_DB: ${POSTGRES_DB:-attestations}
      POSTGRES_USER: ${POSTGRES_USER:-attestations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestations-dev-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
