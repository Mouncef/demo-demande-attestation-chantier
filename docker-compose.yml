# =============================================================================
# Plateforme de gestion des demandes d'attestation de chantier – démarrage :
#     cp .env.example .env   (facultatif : valeurs par défaut de développement intégrées)
#     docker compose up --build
# Services :
#   db        PostgreSQL 16
#   mailpit   serveur SMTP de test + interface web (http://localhost:8025)
#   backend   API Django (migrations automatiques)          http://localhost:8080/api/docs/
#   frontend  React servi par nginx, proxy /api → backend   http://localhost:8080
# =============================================================================
name: attestations-chantier

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attestations}
      POSTGRES_USER: ${POSTGRES_USER:-attestations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestations-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attestations} -d ${POSTGRES_DB:-attestations}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-9f2c1b7e4a6d8e0f1c3b5a7d9e2f4c6b8a0d1e3f5c7b9a2d4}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-attestations}
      POSTGRES_USER: ${POSTGRES_USER:-attestations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestations-dev-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-attestations-chantier@axa-demo.fr}
      MEDIA_ROOT: /data/media
      RELANCE_COOLDOWN_HOURS: ${RELANCE_COOLDOWN_HOURS:-24}
      RELANCE_DELAI_INITIAL_HOURS: ${RELANCE_DELAI_INITIAL_HOURS:-0}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
