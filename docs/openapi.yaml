components:
  schemas:
    AccepterRequest:
      type: object
      properties:
        commentaire:
          type: string
          maxLength: 2000
    ActionEnum:
      enum:
      - CREATION
      - ENVOI
      - RENVOI
      - COMPLEMENTS
      - ACCEPTATION
      - REFUS
      - RELANCE
      - ATTESTATION_PROJET_VALIDEE
      - ATTESTATION_PROJET_SOUMISE
      - ATTESTATION_PROJET_A_CORRIGER
      - ATTESTATION_PROJET_ROUVERTE
      - ATTESTATION_DEFINITIVE_VALIDEE
      type: string
      description: |-
        * `CREATION` - Création
        * `ENVOI` - Envoi au siège
        * `RENVOI` - Renvoi après compléments
        * `COMPLEMENTS` - Compléments demandés
        * `ACCEPTATION` - Acceptation
        * `REFUS` - Refus
        * `RELANCE` - Relance
        * `ATTESTATION_PROJET_VALIDEE` - Projet d'attestation validé (ancien circuit)
        * `ATTESTATION_PROJET_SOUMISE` - Projet d'attestation soumis au siège
        * `ATTESTATION_PROJET_A_CORRIGER` - Projet d'attestation renvoyé pour correction
        * `ATTESTATION_PROJET_ROUVERTE` - Projet d'attestation repris par le distributeur
        * `ATTESTATION_DEFINITIVE_VALIDEE` - Attestation définitive validée
    AnalyseIA:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/AnalyseIAStatutEnum'
          readOnly: true
        score:
          type: integer
          readOnly: true
          title: Score de cohérence (%)
        contenu_hash:
          type: string
          readOnly: true
          title: Empreinte du contenu analysé
        resultat:
