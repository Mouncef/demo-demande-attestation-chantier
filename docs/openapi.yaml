          title: Résultat détaillé
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
      required:
      - contenu_hash
      - created_at
      - created_by
      - id
      - resultat
      - score
      - statut
