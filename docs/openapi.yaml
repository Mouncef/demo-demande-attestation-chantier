openapi: 3.0.3
info:
  title: API – Demandes d'attestation de chantier (AXA)
  version: 1.0.0
  description: 'API REST de la plateforme interne de gestion des demandes d''attestation
    de chantier : saisie du Formulaire de Déclaration du Risque (FDR), pièces justificatives,
    scoring de risque, workflow siège, éditeur d''attestation et analyse de cohérence
    simulée.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Connexion (email + mot de passe) → tokens JWT
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Révoque le refresh token (liste noire) ; l'access token expire
        naturellement (30 min).
      summary: Déconnexion (révocation du refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Token révoqué
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Profil de l'utilisateur connecté.
      summary: Profil de l'utilisateur connecté
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Renouvellement de l'access token (rotation du refresh)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/demandes/:
    get:
      operationId: demandes_list
      summary: Liste des demandes (filtres statut / décision, recherche, tri)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Référence, assuré, chantier, contrat
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandeListeList'
          description: ''
    post:
      operationId: demandes_create
      summary: Créer une demande (brouillon)
      tags:
      - demandes
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/:
    get:
      operationId: demandes_attestations_retrieve
      summary: Lire l'attestation (404 si elle n'existe pas encore)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
    put:
      operationId: demandes_attestations_update
      summary: Créer / mettre à jour le contenu
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnregistrerAttestationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnregistrerAttestationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/analyser/:
    post:
      operationId: demandes_attestations_analyser_create
      description: 'Analyse de cohérence : outil du siège pour établir l''attestation
        définitive (siège + définitive uniquement).'
      summary: Analyser la cohérence FDR ↔ attestation définitive (IA simulée, siège
        uniquement)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyseIA'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/analyses/:
    get:
      operationId: demandes_attestations_analyses_list
      summary: Historique des analyses
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalyseIA'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/demander-correction/:
    post:
      operationId: demandes_attestations_demander_correction_create
      summary: 'Siège : renvoyer le projet soumis au distributeur pour correction'
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemanderCorrectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemanderCorrectionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/gabarit/:
    get:
      operationId: demandes_attestations_gabarit_retrieve
      summary: Contenu initial (gabarit AXA ou copie du projet) et variables
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gabarit'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/pdf/:
    get:
      operationId: demandes_attestations_pdf_retrieve
      summary: 'PDF de l''attestation (définitive : uniquement si validée)'
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          description: application/pdf
  /api/v1/demandes/{demande_pk}/attestations/{kind}/previsualiser/:
    post:
      operationId: demandes_attestations_previsualiser_create
      summary: Prévisualisation HTML (cadre AXA) du contenu fourni ou enregistré
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrevisualiserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrevisualiserRequest'
      responses:
        '200':
          description: text/html
  /api/v1/demandes/{demande_pk}/attestations/{kind}/rouvrir/:
    post:
      operationId: demandes_attestations_rouvrir_create
      summary: Reprendre un projet soumis (distributeur)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/soumettre/:
    post:
      operationId: demandes_attestations_soumettre_create
      summary: Soumettre le projet d'attestation au siège (notification + email)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
  /api/v1/demandes/{demande_pk}/attestations/{kind}/valider/:
    post:
      operationId: demandes_attestations_valider_create
      summary: 'Siège : valider l''attestation définitive (analyse cohérente requise
        ou forçage justifié)'
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - attestations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValiderAttestationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValiderAttestationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
          description: ''
  /api/v1/demandes/{demande_pk}/pieces/:
    get:
      operationId: demandes_pieces_list
      summary: Liste des pièces de la demande
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - pieces
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PieceJointe'
          description: ''
    post:
      operationId: demandes_pieces_create
      summary: 'Déposer une pièce (multipart : fichier + type_piece)'
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - pieces
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadPieceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadPieceRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPieceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceJointe'
          description: ''
  /api/v1/demandes/{demande_pk}/pieces/{id}/:
    patch:
      operationId: demandes_pieces_partial_update
      summary: Changer le type d'une pièce
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pieces
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedModifierTypePieceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedModifierTypePieceRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedModifierTypePieceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceJointe'
          description: ''
    delete:
      operationId: demandes_pieces_destroy
      summary: Supprimer une pièce (suppression logique)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pieces
      responses:
        '204':
          description: No response body
  /api/v1/demandes/{demande_pk}/pieces/{id}/download/:
    get:
      operationId: demandes_pieces_download_retrieve
      summary: Télécharger une pièce (authentifié, contrôle d'accès)
      parameters:
      - in: path
        name: demande_pk
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - pieces
      responses:
        '200':
          description: Flux binaire
  /api/v1/demandes/{id}/:
    get:
      operationId: demandes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
    delete:
      operationId: demandes_destroy
      summary: Supprimer un brouillon jamais envoyé
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      responses:
        '204':
          description: No response body
  /api/v1/demandes/{id}/accepter/:
    post:
      operationId: demandes_accepter_create
      summary: 'Siège : accepter la demande'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccepterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccepterRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/commentaire/:
    patch:
      operationId: demandes_commentaire_partial_update
      summary: Commentaire (distributeur si éditable, siège si en cours)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentaireRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentaireRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/completude/:
    get:
      operationId: demandes_completude_retrieve
      summary: Pièces requises, complétude et validité du FDR
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/demander-complements/:
    post:
      operationId: demandes_demander_complements_create
      summary: 'Siège : demander des éléments complémentaires'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplementsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplementsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/envoyer/:
    post:
      operationId: demandes_envoyer_create
      summary: Envoyer / renvoyer la demande au siège
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvoyerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvoyerRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/fdr/:
    get:
      operationId: demandes_fdr_retrieve
      summary: Lire le FDR
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FDR'
          description: ''
    patch:
      operationId: demandes_fdr_partial_update
      summary: Lire / modifier le FDR (brouillon, verrou optimiste `version`)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFDRPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFDRPatchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/historique/:
    get:
      operationId: demandes_historique_list
      summary: Historique des actions
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoriqueList'
          description: ''
  /api/v1/demandes/{id}/refuser/:
    post:
      operationId: demandes_refuser_create
      summary: 'Siège : refuser la demande (motif obligatoire)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefuserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefuserRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/relancer/:
    post:
      operationId: demandes_relancer_create
      summary: Relancer le siège par email (délai minimal 24 h)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelancerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RelancerRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relance'
          description: ''
  /api/v1/demandes/{id}/relances/:
    get:
      operationId: demandes_relances_list
      summary: Historique des relances
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRelanceList'
          description: ''
  /api/v1/demandes/{id}/scoring/:
    get:
      operationId: demandes_scoring_retrieve
      summary: Scoring de risque simulé (calcul à la volée)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - demandes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeDetail'
          description: ''
  /api/v1/demandes/{id}/soumissions/:
    get:
      operationId: demandes_soumissions_list
      summary: Soumissions successives (snapshots)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
